<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal Académico - Estudiantes</title>
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --text:#2b2b2b; --muted:#5a6672;
  --blue:#1a5fa4; --blue-dark:#0d3d6e; --border:#d7e0e8;
  --head-bg:#eaf1f8; --accent:#c0392b;
}
*{box-sizing:border-box;}
body{
  margin:0; background:#ffffff; color:var(--text);
  font-family:Arial, Helvetica, sans-serif; font-size:14px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
header.banner{
  background:#861f3d; color:#fff; padding:12px 20px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
}
.bannerleft{display:flex; align-items:center; gap:10px;}
.uname{font-size:12.5px; line-height:1.15; font-weight:bold; letter-spacing:.3px;}
.bannerright button{
  background:#2a7fc9; color:#fff; border:none; padding:6px 12px; border-radius:4px;
  font-size:11.5px; margin-left:6px; cursor:default;
}
.goldline{height:4px; background:linear-gradient(to right,#c9a227,#ecd58f,#c9a227);}
.studentbar{text-align:right; font-size:11px; color:#444; padding:4px 20px; background:#fff;}
.tabs{display:flex; gap:6px; padding:10px 16px 0; flex-wrap:wrap;}
.tab{
  background:var(--panel); border:1px solid var(--border); border-bottom:none;
  padding:8px 16px; border-radius:6px 6px 0 0; color:var(--blue); font-weight:bold; cursor:default;
}
.tab.active{background:var(--head-bg);}
.container{max-width:1000px; margin:0 auto; padding:0 16px 40px;}
.panel{
  background:var(--panel); border:1px solid var(--border); border-radius:0 6px 6px 6px;
  padding:16px; margin-top:0;
}
.breadcrumb{font-size:12px; color:var(--muted); margin:14px 0 10px;}
.breadcrumb a{color:var(--blue); text-decoration:none; cursor:pointer;}
.breadcrumb a:hover{text-decoration:underline;}
h1.page-title{font-size:20px; font-weight:400; margin:4px 0 14px; color:var(--text);}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); margin-top:10px;}
.card{background:var(--panel); padding:14px; cursor:pointer; transition:background .15s;}
.card:hover{background:var(--head-bg);}
.card.selected{outline:2px solid var(--blue); outline-offset:-2px;}
.card .ico{color:var(--accent); font-weight:bold; margin-right:4px;}
.card .ctitle{color:var(--blue); font-weight:bold; display:block; margin-bottom:4px;}
.card .ctitle.inactive{color:var(--muted);}
.card p{margin:0; color:var(--muted); font-size:12.5px;}
.expand{
  border:1px solid var(--blue); border-top:none; background:var(--panel);
  padding:14px 20px; margin-top:-1px; margin-bottom:14px;
}
.expand ul{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:8px;}
.expand li a{color:var(--blue); text-decoration:none; font-size:13px;}
.expand li a:hover{text-decoration:underline;}
.expand li.highlight a{font-weight:bold;}
select, button{
  font-size:14px; padding:6px 10px; border-radius:4px; border:1px solid var(--border);
  background:var(--panel); color:var(--text);
}
button.send{
  background:#6b7378; color:#fff; border:none; padding:8px 18px; border-radius:3px; cursor:pointer;
}
button.send:hover{background:#565d61;}
table{border-collapse:collapse; width:100%; margin-top:14px; font-size:13px;}
th{background:var(--head-bg); text-align:left; padding:8px; border:1px solid var(--border);}
td{padding:8px; border:1px solid var(--border);}
a.nrc{color:var(--blue); font-weight:bold; text-decoration:none; cursor:pointer;}
a.nrc:hover{text-decoration:underline;}
.info-block{margin-bottom:18px;}
.info-block h3{font-size:14px; border-bottom:1px solid var(--border); padding-bottom:6px; color:var(--blue);}
.info-row{display:flex; gap:10px; font-size:13px; margin:4px 0;}
.info-row .lbl{min-width:170px; font-weight:bold;}
.linkline{margin-top:16px;}
.linkline a{display:block; color:var(--blue); text-decoration:none; font-size:13px; margin:4px 0; cursor:pointer;}
.linkline a:hover{text-decoration:underline;}
.hidden{display:none;}
.scrollwrap{overflow-x:auto;}
.subtabs{display:flex; gap:18px; border-bottom:1px solid var(--border); padding-bottom:6px; font-size:13px; color:var(--muted); flex-wrap:wrap;}
.subtabs span.active{color:var(--blue); font-weight:bold; border-bottom:2px solid var(--blue); padding-bottom:6px;}
.schedpanel{border:1px solid var(--border); margin-top:10px;}
.schedtabs{background:#2b2b2b; color:#fff; display:flex;}
.schedtabs span{padding:8px 14px; font-size:12.5px; cursor:default;}
.schedtabs span.active{background:#3d3d3d; font-weight:bold;}
.schedtitle{padding:8px 14px; font-weight:bold; font-size:13px; border-bottom:1px solid var(--border); background:#fafafa;}
table.schedtable{width:100%; border-collapse:collapse; font-size:11.5px;}
table.schedtable th{background:#fafafa; border:1px solid var(--border); padding:6px; font-weight:normal; color:var(--muted);}
table.schedtable td{border:1px solid var(--border); height:26px; text-align:left; vertical-align:top; padding:4px;}
td.hr{color:var(--muted); font-size:11px; white-space:nowrap;}
td.blk{font-size:11px; font-weight:bold; color:#1b1b1b;}
td.blk.purple{background:#c9b3e0;}
td.blk.green{background:#aed9a5;}
td.blk.blue{background:#9cc7ef;}
td.blk.pink{background:#e597b0;}
</style>
</head>
<body>
<header class="banner">
  <div class="bannerleft">
    <svg width="34" height="34" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M24 4 L42 10 V24 C42 34 34 42 24 44 C14 42 6 34 6 24 V10 Z" stroke="#fff" stroke-width="2" fill="none"/>
      <rect x="18" y="16" width="12" height="16" fill="none" stroke="#fff" stroke-width="1.3"/>
      <line x1="24" y1="16" x2="24" y2="32" stroke="#fff" stroke-width="1.3"/>
      <line x1="18" y1="20" x2="30" y2="20" stroke="#fff" stroke-width="1"/>
      <line x1="18" y1="24" x2="30" y2="24" stroke="#fff" stroke-width="1"/>

<div class="studentbar" id="userinfoHeader">000319881 JUAN P. SOTO FLOREZ<br><span id="clock"></span></div>
<div class="container">
<div class="panel" id="app"></div>
</div>

<script>
const student = {id:"000319881", name:"JUAN P. SOTO FLOREZ"};
const now = new Date();
document.getElementById('clock').textContent = now.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'}) + ' ' + now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});

const courses = [
 {nrc:27001, materia:"5701", curso:"0010", seccion:"01", titulo:"REGULACIÓN EN TI", creditos:"3.000", final:4.3,
  comps:[["NOTA 1 - Quiz: Normatividad y Cumplimiento",4.0],["NOTA 2 - Taller: Políticas de Seguridad de la Información",4.3],

         ["NOTA 3 - Examen: Modelos Estadísticos y Predictivos",4.8],["NOTA 4 - Laboratorio: Visualización de Datos",4.9],
         ["NOTA 5 - Proyecto: Dashboard Analítico Final",4.7]]},
 {nrc:27005, materia:"5799", curso:"0030", seccion:"01", titulo:"PROYECTO APLICADO EN TI", creditos:"4.000", final:4.4,

const app = document.getElementById('app');
let registroOpen = false;

function go(view, param){
  if(view==='home') renderHome();
  else if(view==='periodo') renderPeriodo();
  else if(view==='resultado') renderResultado(param);
  else if(view==='detalle') renderDetalle(param);
  else if(view==='horario') renderHorario();
}

function renderHome(){
  registroOpen = false;
  app.innerHTML = `
    <div class="breadcrumb">Home &gt; Estudiantes</div>
    <div class="grid">
      ${card('Admisión a otros programas académicos','Consulta o diligencia tu solicitud de admisión.')}

  `;
}
function card(t,d){ return `<div class="card"><span class="ctitle inactive">${t}</span><p>${d}</p></div>`; }

function toggleRegistro(){
  const slot = document.getElementById('expandSlot');
  const c = document.getElementById('cardRegistro');
  if(!registroOpen){
    c.classList.add('selected');
    slot.innerHTML = `
      <div class="expand">
        <ul>
          <li><a>Inscribir y eliminar cursos</a></li>
          <li><a onclick="go('horario')">Horario semanal</a></li>
          <li><a>Estado de cuenta</a></li>
          <li class="highlight"><a onclick="go('periodo')">Calificaciones Parciales</a></li>
          <li><a>Generación de colilla de pago y pago en línea (Pregrado, postgrado, formación continua e idiomas)</a></li>
          <li><a>Ver retenciones</a></li>
        </ul>
      </div>`;
    registroOpen = true;
  } else {
    c.classList.remove('selected');
    slot.innerHTML = '';
    registroOpen = false;
  }
}

function renderPeriodo(){
  app.innerHTML = `

}

function onEnviar(){
  const periodo = document.getElementById('periodoSel').value;

      <div class="info-row"><span class="lbl">Periodo de Admisión:</span><span>2024 semestre 2 - Pregrado</span></div>

      <div class="info-row"><span class="lbl">Periodo de Catálogo:</span><span>${periodo}</span></div>
      <div class="info-row"><span class="lbl">Escuela:</span><span>Ingeniería-Med</span></div>
      <div class="info-row"><span class="lbl">Campus:</span><span>Medellín - Laureles</span></div>
      <div class="info-row"><span class="lbl">Carrera:</span><span>Ing Sistemas e Informática-Med</span></div>
    </div>
    <div class="info-block">
      <h3>Trabajo de Curso</h3>
      <div class="scrollwrap">
      <table>
        <tr><th>NRC</th><th>Materia</th><th>Curso</th><th>Sección</th><th>Título de Curso</th><th>Campus</th><th>Calificación Parcial</th><th>Créditos</th><th>Nivel</th></tr>
        ${rows}
      </table>
      </div>
    </div>
    <div class="linkline"><a onclick="go('periodo')">Selec Otro Periodo</a></div>
  `;
}

function renderDetalle(nrc){
  const c = courses.find(x => x.nrc === nrc);
  const compRows = c.comps.map(([title,score], idx) => {
    const isLast = idx === c.comps.length - 1;
    const scoreCell = isLast ? '' : score.toFixed(2);
    return `
    <tr>
      <td>${title}</td>
      <td>${scoreCell}</td>
      <td>${scoreCell}</td>
      <td>Y</td>
      <td>20</td>
      <td>Final</td>
      <td>Ninguno</td>

  }).join('');

      <div class="info-row"><span class="lbl">Curso:</span><span>${c.curso}</span></div>

      <div class="info-row"><span class="lbl">Título:</span><span>${c.titulo}</span></div>
      <div class="info-row"><span class="lbl">Créditos:</span><span>${c.creditos}</span></div>
      <div class="info-row"><span class="lbl">Nivel:</span><span>Pregrado</span></div>
      <div class="info-row"><span class="lbl">Calificación Parcial:</span><span></span></div>
      <div class="info-row"><span class="lbl">Calificación Final:</span><span>${c.final.toFixed(2)}</span></div>

    <div class="info-block">
      <h3>Componentes</h3>
      <div class="scrollwrap">
      <table>
        <tr><th>Título</th><th>Puntaje</th><th>Calificación</th><th>Debe Aprobar</th><th>Peso</th><th>Incluir en Parcial o Final</th><th>Subcomponentes</th></tr>
        ${compRows}
      </table>
      </div>
    </div>
    <div class="linkline">
      <a onclick="go('resultado','2026 semestre 2 - pregrado')">Regresar a Anterior</a>
      <a onclick="go('resultado','2026 semestre 2 - pregrado')">Selec Otro NRC</a>

renderHome();
</script>
</body>
</html>
